name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - run: sh -n start.sh && bash -n weekly_review.sh
      - run: python scripts/check_docker_context.py
      - run: python scripts/demo_smoke.py
      - run: python scripts/privacy_scan.py
      - run: python -m pip check
      - run: pip-audit -r requirements.txt
